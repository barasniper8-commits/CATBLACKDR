name: win 11 + tailscale + Download.bat script 

on:
  workflow_dispatch:

jobs:
    secure-rdp:
      runs-on: windows-2022
      timeout-minutes: 350
  
      steps:
        - name: Configure Core RDP Settings
          run: |
            Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
            Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
            Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
            netsh advfirewall firewall delete rule name="RDP-Tailscale"
            netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
            Restart-Service -Name TermService -Force
  
        - name: Create RDP User with Fixed Password
          run: |
            $password = "MR.English2008"
            $exists = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
            if (-not $exists) { net user RDP $password /add /expires:never } else { net user RDP$password }
            net localgroup Administrators RDP /add
            net localgroup "Remote Desktop Users" RDP /add
            echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
  
        - name: Install Tailscale
          run: |
            $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $installerPath = "$env:TEMP\tailscale.msi"
            $wc = New-Object System.Net.WebClient
            $wc.DownloadFile($tsUrl,$installerPath)
            Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
            Remove-Item $installerPath -Force
  
        - name: Establish Tailscale Connection
          env:
            TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          run: |
            & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="$env:TS_AUTHKEY" --hostname="gh-runner-$env:GITHUB_RUN_ID"
            $tsIP =$null
            for ($i = 0; $i -lt 15; $i++) {
                $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
                if ($tsIP) { break }
                Start-Sleep -Seconds 4
            }
            if (-not $tsIP) { Write-Error "Tailscale IP not assigned"; exit 1 }
            echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
  
        - name: 1. Buat Folder Tema C:\CustomTheme
          run: |
            $themeDir = "C:\CustomTheme"
            if (-not (Test-Path $themeDir)) {
                [void](New-Item -ItemType Directory -Path $themeDir -Force)
            }
  
        - name: 2. Unduh Gambar Wallpaper
          run: |
            $url = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1600"
            $out = "C:\CustomTheme\wallpaper.jpg"
            $wc = New-Object System.Net.WebClient
            $wc.DownloadFile($url,$out)
  
        - name: 3. Unduh Gambar Lock Screen
          run: |
            $url = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1600"
            $out = "C:\CustomTheme\lock_screen.jpg"
            $wc = New-Object System.Net.WebClient
            $wc.DownloadFile($url,$out)
  
        - name: 4. Terapkan Wallpaper Registry & Layar Kunci
          run: |
            $policyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization"
            if (-not (Test-Path $policyPath)) {
                [void](New-Item -Path $policyPath -Force)
            }
            Set-ItemProperty -Path $policyPath -Name "LockScreenImage" -Value "C:\CustomTheme\lock_screen.jpg" -Force
            Set-ItemProperty -Path $policyPath -Name "DesktopImagePath" -Value "C:\CustomTheme\wallpaper.jpg" -Force
            Write-Host "✅ Wallpaper dan Lock Screen berhasil diatur!"
  
        - name: 5. Tunggu Profil RDP & Salin Avatar
          run: |
            $rdpProfile = "C:\Users\RDP"
            while (-not (Test-Path $rdpProfile)) {
                Write-Host "[$(Get-Date)] Menunggu profil RDP dibuat..."
                Start-Sleep -Seconds 15
            }
            $avatarUrl = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500"
            $avatarPath = "C:\CustomTheme\user_avatar.jpg"
            $wc = New-Object System.Net.WebClient
            $wc.DownloadFile($avatarUrl,$avatarPath)
            Copy-Item -Path $avatarPath -Destination "$rdpProfile\Desktop\Foto_Profil.jpg" -Force
            Write-Host "✅ Foto profil berhasil disalin ke Desktop RDP!"
  
        - name: 6. Salin & Jalankan Downloads.bat
          run: |
            $rdpProfile = "C:\Users\RDP"
            $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
            if (-not (Test-Path $startupPath)) {
                [void](New-Item -ItemType Directory -Path $startupPath -Force)
            }
            $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
            $downloadPath = "$startupPath\Downloads.bat"
            
            $wc = New-Object System.Net.WebClient
            $wc.DownloadFile($downloadUrl,$downloadPath)
            Write-Host "✅ Downloads.bat berhasil disalin ke Startup!"
            
            cmd /c $downloadPath
            Write-Host "✅ Downloads.bat berhasil dieksekusi!"
  
        - name: 7. Pertahankan Koneksi RDP
          run: |
            Write-Host "`n=== INFORMASI AKSES RDP ==="
            Write-Host "Alamat IP (Tailscale): $env:TAILSCALE_IP"
            Write-Host "Username: RDP"
            Write-Host "Password: MR.English2008"
            Write-Host "============================`n"
            
            while ($true) {
                Write-Host "[$(Get-Date)] RDP Aktif - Biarkan jendela ini tetap berjalan"
                Start-Sleep -Seconds 300
            }
