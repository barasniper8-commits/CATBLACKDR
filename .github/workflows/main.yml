name: win 11 + tailscale + Download.bat script 

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        shell: cmd
        run: |
          powershell -Command "Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force"
          powershell -Command "Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force"
          powershell -Command "Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force"
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          powershell -Command "Restart-Service -Name TermService -Force"

      - name: Create RDP User with Fixed Password
        shell: cmd
        run: |
          net user RDP MR.English2008 /add /expires:never
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add
          powershell -Command "echo 'RDP_CREDS=User: RDP | Password: MR.English2008' >> $env:GITHUB_ENV"

      - name: Install Tailscale
        shell: cmd
        run: |
          powershell -Command "$webClient = New-Object System.Net.WebClient; $webClient.DownloadFile('https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi', '$env:TEMP\tailscale.msi')"
          msiexec.exe /i "%TEMP%\tailscale.msi" /quiet /norestart
          del /f /q "%TEMP%\tailscale.msi"

      - name: Establish Tailscale Connection
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        shell: cmd
        run: |
          "%ProgramFiles%\Tailscale\tailscale.exe" up --authkey="%TS_AUTHKEY%" --hostname="gh-runner-%GITHUB_RUN_ID%"
          
          :wait_ip
          "%ProgramFiles%\Tailscale\tailscale.exe" ip -4 > "%TEMP%\ts_ip.txt" 2>nul
          set /p TS_IP=<"%TEMP%\ts_ip.txt"
          if "%TS_IP%"=="" (
              timeout /t 5 /nobreak >nul
              goto wait_ip
          )
          echo Tailscale IP assigned: %TS_IP%
          powershell -Command "echo 'TAILSCALE_IP=%TS_IP%' >> $env:GITHUB_ENV"

      - name: Download & Terapkan Wallpaper & Lock Screen
        shell: cmd
        run: |
          if not exist C:\CustomTheme mkdir C:\CustomTheme
          powershell -Command "(New-Object System.Net.WebClient).DownloadFile('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1600', 'C:\CustomTheme\lock_screen.jpg')"
          powershell -Command "(New-Object System.Net.WebClient).DownloadFile('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1600', 'C:\CustomTheme\wallpaper.jpg')"
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization" /v LockScreenImage /t REG_SZ /d "C:\CustomTheme\lock_screen.jpg" /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization" /v DesktopImagePath /t REG_SZ /d "C:\CustomTheme\wallpaper.jpg" /f
          echo ✅ Wallpaper dan Lock Screen berhasil diatur!

      - name: Maintain Connection + Watch RDP User
        shell: cmd
        run: |
          echo.
          echo === RDP ACCESS ===
          echo Address: %TAILSCALE_IP%
          echo Username: RDP
          echo Password: MR.English2008
          echo ==================
          echo.

          :loop
          if exist C:\Users\RDP (
              goto setup_user
          ) else {
              echo [%DATE% %TIME%] Waiting for RDP profile to be created...
              timeout /t 30 /nobreak >nul
              goto loop
          }

          :setup_user
          if not exist "C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup" mkdir "C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          powershell -Command "(New-Object System.Net.WebClient).DownloadFile('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500', 'C:\CustomTheme\user_avatar.jpg')"
          copy /y "C:\CustomTheme\user_avatar.jpg" "C:\Users\RDP\Desktop\Foto_Profil.jpg"
          powershell -Command "(New-Object System.Net.WebClient).DownloadFile('https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat', 'C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\Downloads.bat')"
          
          cmd /c "C:\Users\RDP\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\Downloads.bat"
          echo ✅ Downloads.bat executed successfully

          :keepalive
          echo RDP Active - Use Ctrl+C in workflow to terminate
          timeout /t 300 /nobreak >nul
          goto keepalive
