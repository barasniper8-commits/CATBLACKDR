
name: Win 11 + Tailscale + Wallpaper + Download BAT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: "1. Configure Core RDP Settings"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          # Tetap aktifkan Network Level Authentication.
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' -Value 2

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 `
            remoteip=100.64.0.0/10

          if ($LASTEXITCODE -ne 0) {
            throw "Gagal membuat aturan firewall RDP."
          }

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          Write-Host "RDP settings configured."

      - name: "2. Create RDP User"
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Buat GitHub Secret bernama RDP_PASSWORD terlebih dahulu."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "RDP" `
            -ErrorAction SilentlyContinue

          if (-not $user) {
            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }
          else {
            Set-LocalUser -Name "RDP" -Password $securePassword
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member "RDP" -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member "RDP" -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "RDP")) {
            throw "Pembuatan akun RDP gagal."
          }

          Write-Host "Akun RDP berhasil disiapkan."

      - name: "3. Install Tailscale"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.msi"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList @("/i", "`"$installer`"", "/quiet", "/norestart") `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
            throw "Instalasi Tailscale gagal: $($process.ExitCode)"
          }

      - name: "4. Connect Tailscale"
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "GitHub Secret TAILSCALE_AUTHKEY belum diisi."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            "--authkey=$env:TS_AUTHKEY" `
            "--hostname=rdp-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale gagal terhubung."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12 -and -not $tsIP; $i++) {
            Start-Sleep -Seconds 5
            $result = & $ts ip -4
            if ($LASTEXITCODE -eq 0 -and $result) {
              $tsIP = ($result | Select-Object -First 1).Trim()
            }
          }

          if (-not $tsIP) {
            throw "Alamat IPv4 Tailscale tidak tersedia."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IPv4: $tsIP"

      - name: "5. Download Wallpaper and Lock Screen"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $themeDir = "C:\CustomTheme"
          New-Item -ItemType Directory -Path $themeDir -Force |
            Out-Null

          $imageUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhzLeo5tAdHA-WjC1GTIVPdb3PGFhDVyL8Ebvmu5scScHRI58C1WfxoxjXdLVgD6KodOiPkakz1HfmCcopdW0vmE158IP4HoykzwI8JnsdzT6aIMvBrHbm-XuhzTmawbyWreEDTupVbwNXqVfEgBFPoqP4ROGzVGHCZdQLd7yJCGXJe_dVKbwGQTAxWOng/s1600/1000186452.jpg"

          $wallpaper = "$themeDir\wallpaper.jpg"
          $lockScreen = "$themeDir\lock_screen.jpg"

          Invoke-WebRequest -Uri $imageUrl `
            -OutFile $wallpaper -UseBasicParsing

          Copy-Item -Path $wallpaper `
            -Destination $lockScreen -Force

          foreach ($file in @($wallpaper, $lockScreen)) {
            if (-not (Test-Path $file)) {
              throw "File gambar tidak ditemukan: $file"
            }

            if ((Get-Item $file).Length -lt 1024) {
              throw "File gambar terlalu kecil atau unduhan gagal: $file"
            }
          }

          Write-Host "Wallpaper berhasil diunduh."
          Write-Host "Lokasi: $wallpaper"

      - name: "6. Apply Wallpaper to RDP User Profile"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $themeDir = "C:\CustomTheme"
          $wallpaper = "$themeDir\wallpaper.jpg"
          $lockScreen = "$themeDir\lock_screen.jpg"
          $profile = "C:\Users\RDP"
          $hiveFile = "$profile\NTUSER.DAT"

          # Kebijakan lock screen. Dukungan bergantung pada edisi Windows.
          $policyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization"

          if (-not (Test-Path $policyPath)) {
            New-Item -Path $policyPath -Force | Out-Null
          }

          Set-ItemProperty -Path $policyPath `
            -Name "LockScreenImage" `
            -Value $lockScreen -Force

          # Siapkan profil jika belum dibuat oleh sistem.
          if (-not (Test-Path $profile)) {
            New-Item -ItemType Directory -Path $profile -Force |
              Out-Null
          }

          # Atur wallpaper langsung pada registry profil RDP.
          # Jika NTUSER.DAT belum ada, profil belum selesai dibuat.
          if (Test-Path $hiveFile) {
            $tempHive = "HKU\RDP_TEMP_WALLPAPER"
            $regPath = "Registry::HKEY_USERS\RDP_TEMP_WALLPAPER"

            & reg.exe load $tempHive $hiveFile

            if ($LASTEXITCODE -eq 0) {
              try {
                $desktopKey = "$regPath\Control Panel\Desktop"

                if (-not (Test-Path $desktopKey)) {
                  New-Item -Path $desktopKey -Force | Out-Null
                }

                Set-ItemProperty -Path $desktopKey `
                  -Name "Wallpaper" `
                  -Value $wallpaper -Force

                Set-ItemProperty -Path $desktopKey `
                  -Name "WallpaperStyle" `
                  -Value "10" -Force

                Set-ItemProperty -Path $desktopKey `
                  -Name "TileWallpaper" `
                  -Value "0" -Force

                Write-Host "Wallpaper profil RDP berhasil diatur."
              }
              finally {
                [gc]::Collect()
                [gc]::WaitForPendingFinalizers()
                & reg.exe unload $tempHive
              }
            }
            else {
              Write-Host "Hive profil belum dapat dimuat."
              Write-Host "Wallpaper perlu diterapkan saat profil dibuat."
            }
          }
          else {
            Write-Host "Profil RDP belum memiliki NTUSER.DAT."
            Write-Host "Gambar tersimpan dan akan perlu diterapkan saat login."
          }

          Write-Host "Wallpaper: $wallpaper"
          Write-Host "Lock screen: $lockScreen"

      - name: "7. Prepare Downloads BAT and Profile Image"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $themeDir = "C:\CustomTheme"
          $profile = "C:\Users\RDP"
          $desktop = "$profile\Desktop"
          $startup = "$profile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          New-Item -ItemType Directory -Path $desktop -Force |
            Out-Null

          New-Item -ItemType Directory -Path $startup -Force |
            Out-Null

          $avatarUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhmN4r8QQGWBuwdrDIE14cm92glQ6NGb20JY9-3fQ-fqBA4tMU5jCnqT-IGypusofrW6mHYJ4_SfTl0mehMAwKf1hI_rbDz_XUxRLfhQG0wZ_Zutv14soi931Rx1tR6bRafIaCp0oGpTc2dYShTbHJWHKbKrosZRMUwHG5i0wl25-f3B4wNZPT1nkdRdO0/s1600/1000184069.jpg"

          Invoke-WebRequest -Uri $avatarUrl `
            -OutFile "$themeDir\user_avatar.jpg" `
            -UseBasicParsing

          Copy-Item "$themeDir\user_avatar.jpg" `
            "$desktop\Foto_Profil.jpg" -Force

          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startup\Downloads.bat"

          Invoke-WebRequest -Uri $downloadUrl `
            -OutFile $downloadPath -UseBasicParsing

          if (-not (Test-Path $downloadPath)) {
            throw "Downloads.bat gagal diunduh."
          }

          Write-Host "Downloads.bat berhasil disimpan."
          Write-Host "Periksa isi BAT sebelum menjalankannya."

      - name: "8. Maintain Connection"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========== RDP ACCESS =========="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: gunakan nilai secret RDP_PASSWORD"
          Write-Host "================================"

          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner aktif."
            Start-Sleep -Seconds 60
          }
