      - name: "2. Create RDP User"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $password = "GANTI_DENGAN_PASSWORD_KAMU"
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          $user = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if (-not $user) {
            New-LocalUser -Name "RDP" `
              -Password $securePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          } else {
            Set-LocalUser -Name "RDP" -Password $securePassword
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member "RDP" -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member "RDP" -ErrorAction SilentlyContinue

          Write-Host "Akun RDP berhasil disiapkan."
